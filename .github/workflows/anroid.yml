name: Release

# 触发条件: 这里是push以”v“开头的tag触发
on:
  push:
    # 根据branch或者tags来触发
    branches:
      - main
      - feature/*

    tags:
      - "v*"
  # 手动重新发布已有 tag：重新编译、签名并替换 Release 里的 APK
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新发布的 tag，例如 v2.0.2"
        required: true
    # 忽略的标签类型，不触发构建流程(和tags不能同时写)
    # tags-ignore:
    #   - "d*"
env:
  BUILD_TOOLS_VERSION: "35.0.1"
  # 推送 tag 时取 tag 名，手动触发时取输入的 tag
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
# strategy:
  # 矩阵使用: ${{ matrix.os }}
  # 下面两个矩阵，会代码就会执行 2 * 3 = 6次
  # matrix:
  #  os: [ubuntu-16.04, ubuntu-18.04]
  #  node: [6, 8, 10]

# 一次持续集成的运行，可以完成多个任务(下面就build)
jobs:
  builds:
    # 构建的系统(ubuntu、windows、macos)
    runs-on: ubuntu-latest

    # 可以依赖其他job
    # needs: xxxJob、[job1, job2]

    # 构建权限，ncipollo/release-action需要使用
    permissions:
      contents: write

    # 操作步骤(按顺序执行)
    steps:

      # 拉取仓库代码
      - uses: actions/checkout@v3
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      # 设置Java运行环境(temurin是开源jdk)，可以设置为: 1.8
      - uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 21
      # 3. 安装 Android SDK 和 Build Tools
      # 显式列出要装的包：默认列表里的 tools 已从 SDK 仓库下架，会导致安装失败
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-31 build-tools;${{ env.BUILD_TOOLS_VERSION }}"
      # 设置gradle环境(比如: 6.5)、打包命令
      - uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.9
          arguments: assembleRelease

      # 签名 apk
      # 必须用 --alignment-preserved：不让 apksigner 重写对齐填充，
      # 这样 F-Droid 把本签名复制到它自己编出的未签名包上时能验证通过（可复现构建）
      - name: Sign APK
        if: env.IS_RELEASE == 'true'
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" sign \
            --alignment-preserved \
            --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEY_STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "bluehandle_$RELEASE_TAG.apk" \
            app/build/outputs/apk/release/app-release-unsigned.apk
          rm -f "$RUNNER_TEMP/release.jks"
          "$ANDROID_SDK_ROOT/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --print-certs "bluehandle_$RELEASE_TAG.apk"

      # 发布
      - uses: ncipollo/release-action@v1
        if: env.IS_RELEASE == 'true'
        with:
          tag: ${{ env.RELEASE_TAG }}
          # 手动重新发布时更新已有 Release，并替换同名 APK
          allowUpdates: true
          replacesArtifacts: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true
          # 要包含到Release Assets中的文件
          artifacts: "*.apk"
          # 会使用一个临时的token来创建Release
          token: ${{ github.token }}
          # 自动生成一些变化列表之类的内容。
          generateReleaseNotes: true
