<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>遥控器</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B8D3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #E8EDF7; font-family: 'Noto Sans SC', system-ui, sans-serif; padding: 16px 24px 24px; display: flex; flex-direction: column; align-items: center; gap: 18px">

  <div style="width: 100%; display: flex; align-items: center; justify-content: space-between; height: 48px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="font-size: 17px; font-weight: 700">电脑遥控器</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA6BD">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #4C9AFF"></span>
        已连接 · Wi‑Fi
      </div>
    </div>
    <button aria-label="切换遥控模式" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect></svg>
    </button>
  </div>

  <div style="width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <button style="height: 62px; border-radius: 16px; border: 1px solid #5A4318; background: #2A2112; color: #F5A524; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
        锁屏
      </span>
      <span style="font-size: 10px; color: #D9A54A">Win+L</span>
    </button>
    <button style="height: 62px; border-radius: 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="11" rx="2"></rect><path d="M8 4h11a2 2 0 0 1 2 2v9"></path></svg>
        切换窗口
      </span>
      <span style="font-size: 10px; color: #9AA6BD">Alt+Tab</span>
    </button>
    <button style="height: 62px; border-radius: 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; cursor: pointer">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"></path><path d="M22 9l-6 6M16 9l6 6"></path></svg>
        静音
      </span>
      <span style="font-size: 10px; color: #9AA6BD">媒体键</span>
    </button>
  </div>

  <div style="position: relative; width: 256px; height: 256px; border-radius: 50%; background: #141D2E; border: 1px solid #27334D; box-sizing: border-box; flex-shrink: 0">
    <button aria-label="方向上" style="position: absolute; top: 6px; left: 79px; width: 96px; height: 74px; border: none; border-radius: 40px 40px 16px 16px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
    </button>
    <button aria-label="方向下" style="position: absolute; bottom: 6px; left: 79px; width: 96px; height: 74px; border: none; border-radius: 16px 16px 40px 40px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
    <button aria-label="方向左" style="position: absolute; left: 6px; top: 79px; width: 74px; height: 96px; border: none; border-radius: 40px 16px 16px 40px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <button aria-label="方向右" style="position: absolute; right: 6px; top: 79px; width: 74px; height: 96px; border: none; border-radius: 16px 40px 40px 16px; background: #1C2740; color: #8AB8FF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button aria-label="确定 回车" style="position: absolute; top: 77px; left: 77px; width: 100px; height: 100px; border-radius: 50%; border: 6px solid #0B1220; background: {{accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; cursor: pointer; box-sizing: border-box">
      <span style="font-size: 20px; font-weight: 700">OK</span>
      <span style="font-size: 10px; color: #D6E4FF">Enter</span>
    </button>
  </div>

  <div style="width: 100%; display: flex; justify-content: space-between; padding: 0 8px; box-sizing: border-box">
    <button style="width: 80px; height: 58px; border-radius: 29px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 0 1 0 10h-3"></path></svg>
      返回
      <span style="font-size: 10px; color: #9AA6BD">Esc</span>
    </button>
    <button style="width: 80px; height: 58px; border-radius: 29px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
      桌面
      <span style="font-size: 10px; color: #9AA6BD">Win+D</span>
    </button>
    <button style="width: 80px; height: 58px; border-radius: 29px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
      菜单
      <span style="font-size: 10px; color: #9AA6BD">右键菜单</span>
    </button>
  </div>

  <div style="width: 100%; display: flex; align-items: stretch; justify-content: space-between; gap: 14px">
    <div style="width: 84px; height: 160px; border-radius: 42px; background: #141D2E; border: 1px solid #27334D; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box">
      <button aria-label="音量加" style="width: 64px; height: 52px; border: none; border-radius: 30px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
      </button>
      <div style="font-size: 12px; color: #9AA6BD">音量</div>
      <button aria-label="音量减" style="width: 64px; height: 52px; border: none; border-radius: 30px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
      </button>
    </div>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 12px">
      <a href="TvVoice.dc.html" aria-label="语音输入" style="flex: 3; border-radius: 20px; border: 1.5px solid {{accent}}; background: #16223A; color: #8AB8FF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 13px; font-weight: 500; text-decoration: none">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
        语音输入
      </a>
      <a href="TvNumpad.dc.html" style="flex: 2; border-radius: 20px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
        <span style="font-size: 17px; font-weight: 700; letter-spacing: 1px">123</span>
        <span style="font-size: 11px; color: #9AA6BD">数字键</span>
      </a>
    </div>

    <div style="width: 84px; height: 160px; border-radius: 42px; background: #141D2E; border: 1px solid #27334D; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 6px 0; box-sizing: border-box">
      <button aria-label="向上翻页" style="width: 64px; height: 52px; border: none; border-radius: 30px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
      </button>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 1px">
        <span style="font-size: 12px; color: #9AA6BD">翻页</span>
        <span style="font-size: 9px; color: #9AA6BD">PgUp/Dn</span>
      </div>
      <button aria-label="向下翻页" style="width: 64px; height: 52px; border: none; border-radius: 30px; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
      </button>
    </div>
  </div>

  <div style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: auto">
    <button aria-label="上一曲" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18 6l-9 6 9 6z"></path><rect x="5" y="6" width="2.5" height="12" rx="1"></rect></svg>
    </button>
    <button aria-label="播放或暂停" style="width: 72px; height: 72px; border-radius: 50%; border: none; background: #F5A524; color: #1A1206; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 4l9 8-9 8z"></path><rect x="15" y="5" width="2.5" height="14" rx="1"></rect><rect x="19" y="5" width="2.5" height="14" rx="1"></rect></svg>
    </button>
    <button aria-label="下一曲" style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6l9 6-9 6z"></path><rect x="16.5" y="6" width="2.5" height="12" rx="1"></rect></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6D5AE6","#0E8A7E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F6FEB' };
}
}
</script>
</body>
</html>
