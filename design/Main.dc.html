    <a href="TvRemote.dc.html" style="min-height: 76px; border-radius: 16px; border: 1.5px solid {{accent}}; background: #16223A; color: #E8EDF7; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-decoration: none">

    </a>
    <a href="Ppt.dc.html" style="min-height: 76px; border-radius: 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; gap: 14px; padding: 0 16px; text-decoration: none">
