<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PPT 演示</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B8D3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #E8EDF7; font-family: 'Noto Sans SC', system-ui, sans-serif; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 2px">
      <div style="font-size: 17px; font-weight: 700">PPT 演示</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA6BD">
        <span style="width: 7px; height: 7px; border-radius: 50%; background: #4C9AFF"></span>
        已连接 · 蓝牙
      </div>
    </div>
    <button aria-label="演示设置" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"></path><circle cx="16" cy="7" r="2"></circle><circle cx="10" cy="17" r="2"></circle></svg>
    </button>
  </div>

  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #9AA6BD">已演讲</div>
      <div style="font-size: 30px; font-weight: 700; letter-spacing: 1px; font-variant-numeric: tabular-nums">12:48</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
      <div style="font-size: 12px; color: #F5A524">距 20 分钟还剩 7:12</div>
      <div style="display: flex; gap: 8px">
        <button aria-label="暂停计时" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #27334D; background: #0B1220; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
        </button>
        <button aria-label="重置计时" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #27334D; background: #0B1220; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
    <button style="height: 64px; border-radius: 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8AB8FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M10 8l4 2-4 2z"></path></svg>
      从当前页
      <span style="font-size: 10px; color: #9AA6BD">Shift+F5</span>
    </button>
    <button style="height: 64px; border-radius: 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#E8EDF7" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect></svg>
      黑屏
      <span style="font-size: 10px; color: #9AA6BD">B</span>
    </button>
    <button style="height: 64px; border-radius: 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; cursor: pointer">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
      退出放映
      <span style="font-size: 10px; color: #9AA6BD">Esc</span>
    </button>
  </div>

  <button aria-label="上一页" style="height: 104px; border-radius: 22px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 18px; font-weight: 500; cursor: pointer">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
    上一页
  </button>

  <button aria-label="下一页" style="flex: 1; border-radius: 28px; border: none; background: {{accent}}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    <span style="font-size: 26px; font-weight: 700">下一页</span>
    <span style="font-size: 13px; color: #D6E4FF">也可以按手机音量键翻页</span>
  </button>

  <div style="display: flex; align-items: center; justify-content: center; gap: 16px; font-size: 12px; color: #9AA6BD">
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="16" rx="2"></rect><path d="M3 8v8M21 8v8"></path></svg>
      翻页震动 已开启
    </span>
    <span style="display: flex; align-items: center; gap: 6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M2 12h2M20 12h2"></path></svg>
      屏幕常亮
    </span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6D5AE6","#0E8A7E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F6FEB' };
}
}
</script>
</body>
</html>
