<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>设置</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B8D3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1560px; box-sizing: border-box; background: #0B1220; color: #E8EDF7; font-family: 'Noto Sans SC', system-ui, sans-serif; padding: 16px 20px 32px; display: flex; flex-direction: column; gap: 10px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px; margin-bottom: 6px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 700">设置</div>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 6px 4px 0">连接</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #1F2A40">
      <div style="font-size: 15px">默认连接方式</div>
      <div style="display: flex; background: #0B1220; border-radius: 12px; padding: 4px; gap: 4px">
        <button aria-pressed="true" style="flex: 1; height: 38px; border: none; border-radius: 9px; background: #1C2740; color: #E8EDF7; font-size: 14px; font-weight: 500; cursor: pointer">Wi‑Fi</button>
        <button aria-pressed="false" style="flex: 1; height: 38px; border: none; border-radius: 9px; background: transparent; color: #9AA6BD; font-size: 14px; cursor: pointer">蓝牙</button>
      </div>
    </div>
    <div style="min-height: 56px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1F2A40">
      <div style="font-size: 15px">Wi‑Fi 端口</div>
      <div style="font-size: 15px; color: #9AA6BD; font-variant-numeric: tabular-nums">8088</div>
    </div>
    <button style="width: 100%; min-height: 56px; padding: 0 16px; border: none; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; cursor: pointer; text-align: left">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">系统网络设置</span>
        <span style="font-size: 12px; color: #9AA6BD">打开 Wi‑Fi 与蓝牙的系统设置页</span>
      </span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 10px 4px 0">反馈</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <div style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #1F2A40">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">按键震动</span>
        <span style="font-size: 12px; color: #9AA6BD">按下任意按键时短震一下</span>
      </span>
      <button aria-label="按键震动" aria-pressed="true" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>
    <div style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">屏幕常亮</span>
        <span style="font-size: 12px; color: #9AA6BD">连接期间不自动熄屏</span>
      </span>
      <button aria-label="屏幕常亮" aria-pressed="true" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 10px 4px 0">游戏手柄</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <div style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #1F2A40">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">重力感应</span>
        <span style="font-size: 12px; color: #9AA6BD">左右倾斜手机发送方向键</span>
      </span>
      <button aria-label="重力感应" aria-pressed="false" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: #33405C; padding: 3px; display: flex; justify-content: flex-start; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 50%; background: #C9D2E3"></span></button>
    </div>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <span style="font-size: 15px; color: #9AA6BD">倾斜灵敏度</span>
        <span style="font-size: 13px; color: #9AA6BD">50 · 开启重力感应后可调</span>
      </div>
      <div style="position: relative; height: 24px; display: flex; align-items: center" aria-hidden="true">
        <div style="width: 100%; height: 6px; border-radius: 3px; background: #27334D"></div>
        <div style="position: absolute; left: 0; width: 50%; height: 6px; border-radius: 3px; background: #4A5878"></div>
        <div style="position: absolute; left: calc(50% - 11px); width: 22px; height: 22px; border-radius: 50%; background: #6B7896"></div>
      </div>
    </div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 10px 4px 0">PPT 演示</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <div style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #1F2A40">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">音量键翻页</span>
        <span style="font-size: 12px; color: #9AA6BD">音量加上一页，音量减下一页</span>
      </span>
      <button aria-label="音量键翻页" aria-pressed="true" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>
    <div style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid #1F2A40">
      <span style="font-size: 15px">目标演讲时长</span>
      <div style="display: flex; align-items: center; gap: 4px">
        <button aria-label="减少 5 分钟" style="width: 44px; height: 36px; border-radius: 10px; border: 1px solid #27334D; background: #0B1220; color: #E8EDF7; font-size: 18px; cursor: pointer">−</button>
        <span style="width: 64px; text-align: center; font-size: 15px; font-variant-numeric: tabular-nums">20 分钟</span>
        <button aria-label="增加 5 分钟" style="width: 44px; height: 36px; border-radius: 10px; border: 1px solid #27334D; background: #0B1220; color: #E8EDF7; font-size: 18px; cursor: pointer">+</button>
      </div>
    </div>
    <div style="min-height: 60px; padding: 8px 16px; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <span style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px">剩余 2 分钟时提醒</span>
        <span style="font-size: 12px; color: #9AA6BD">长震动一次，不发出声音</span>
      </span>
      <button aria-label="剩余 2 分钟时提醒" aria-pressed="true" style="width: 50px; height: 30px; border-radius: 15px; border: none; background: {{accent}}; padding: 3px; display: flex; justify-content: flex-end; cursor: pointer; flex-shrink: 0"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span></button>
    </div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 10px 4px 0">语音输入</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <button style="width: 100%; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid #1F2A40; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
      <span style="font-size: 15px">识别语言</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9AA6BD">普通话
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
    </button>
    <button style="width: 100%; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid #1F2A40; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
      <span style="font-size: 15px">识别引擎</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9AA6BD">系统输入法
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
    </button>
    <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 15px">发送到电脑后默认</div>
      <div style="display: flex; background: #0B1220; border-radius: 12px; padding: 4px; gap: 4px">
        <button aria-pressed="false" style="flex: 1; height: 38px; border: none; border-radius: 9px; background: transparent; color: #9AA6BD; font-size: 14px; cursor: pointer">只输入文字</button>
        <button aria-pressed="true" style="flex: 1; height: 38px; border: none; border-radius: 9px; background: #1C2740; color: #E8EDF7; font-size: 14px; font-weight: 500; cursor: pointer">输入并回车</button>
      </div>
    </div>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 10px 4px 0">游戏手柄键位</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <a href="GamepadScheme.dc.html" style="min-height: 56px; padding: 0 16px; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; text-decoration: none">
      <span style="font-size: 15px">键位方案管理</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9AA6BD">2 套
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
    </a>
  </div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 10px 4px 0">帮助与关于</div>
  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 18px; overflow: hidden">
    <button style="width: 100%; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid #1F2A40; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
      <span style="font-size: 15px">使用帮助</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button style="width: 100%; min-height: 56px; padding: 0 16px; border: none; border-bottom: 1px solid #1F2A40; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
      <span style="font-size: 15px">下载电脑端</span>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <button style="width: 100%; min-height: 56px; padding: 0 16px; border: none; background: transparent; color: #E8EDF7; display: flex; align-items: center; justify-content: space-between; cursor: pointer">
      <span style="font-size: 15px">关于蓝色手柄</span>
      <span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #9AA6BD">1.8.3
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA6BD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </span>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6D5AE6","#0E8A7E"]},"$preview":{"width":390,"height":1560}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F6FEB' };
}
}
</script>
</body>
</html>
