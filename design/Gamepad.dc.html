<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>游戏手柄 横屏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B8D3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 844px; height: 390px; box-sizing: border-box; background: #0B1220; color: #E8EDF7; font-family: 'Noto Sans SC', system-ui, sans-serif; padding: 14px 40px 24px; display: flex; flex-direction: column; gap: 10px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
    <div style="display: flex; align-items: center; gap: 10px">
      <a href="Main.dc.html" aria-label="返回首页，连接保持" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <a href="GamepadScheme.dc.html" aria-label="当前键位：默认键位，点击更换或编辑键位方案" style="height: 40px; padding: 0 10px 0 12px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; gap: 10px; text-decoration: none">
        <span style="display: flex; flex-direction: column; gap: 0">
          <span style="font-size: 13px; font-weight: 700; line-height: 1.3">游戏手柄</span>
          <span style="font-size: 11px; color: #8AB8FF; line-height: 1.3">键位：默认键位</span>
        </span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8AB8FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
    </div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #9AA6BD">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #4C9AFF"></span>
      已连接 · 蓝牙
    </div>
    <div style="display: flex; gap: 8px">
      <button aria-label="重力感应" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #9AA6BD; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="2" width="12" height="20" rx="2.5"></rect><path d="M2 9a6 6 0 0 0 0 6M22 9a6 6 0 0 1 0 6"></path></svg>
      </button>
      <button aria-label="按键震动" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid {{accent}}; background: #16223A; color: #8AB8FF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="4" width="10" height="16" rx="2"></rect><path d="M3 8v8M21 8v8"></path></svg>
      </button>
      <button aria-label="断开连接" style="width: 40px; height: 40px; border-radius: 12px; border: 1px solid #5A4318; background: #2A2112; color: #F5A524; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3v8"></path><path d="M6.3 7.3a8 8 0 1 0 11.4 0"></path></svg>
      </button>
    </div>
  </div>

  <div style="flex: 1; display: flex; align-items: center; justify-content: space-between">

    <div style="width: 220px; height: 220px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-template-rows: repeat(3, minmax(0, 1fr)); gap: 4px">
      <div></div>
      <button aria-label="上" style="border-radius: 16px 16px 6px 6px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 7l6 8H6z"></path></svg>
      </button>
      <div></div>
      <button aria-label="左" style="border-radius: 16px 6px 6px 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 12l8-6v12z"></path></svg>
      </button>
      <div style="background: #141D2E; border-radius: 6px; border: 1px solid #27334D"></div>
      <button aria-label="右" style="border-radius: 6px 16px 16px 6px; border: 1px solid {{accent}}; background: #1C2740; color: #8AB8FF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17 12l-8 6V6z"></path></svg>
      </button>
      <div></div>
      <button aria-label="下" style="border-radius: 6px 6px 16px 16px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 17l-6-8h12z"></path></svg>
      </button>
      <div></div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 18px">
      <div style="display: flex; gap: 14px">
        <button style="width: 92px; height: 36px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 13px; letter-spacing: 1px; cursor: pointer">SELECT</button>
        <button style="width: 92px; height: 36px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 13px; letter-spacing: 1px; cursor: pointer">START</button>
      </div>
      <div style="font-size: 12px; color: #9AA6BD">支持多指同时按下</div>
    </div>

    <div style="position: relative; width: 230px; height: 230px">
      <button style="position: absolute; top: 0; left: 79px; width: 72px; height: 72px; border-radius: 50%; border: 1px solid #27334D; background: #141D2E; color: #8AB8FF; font-size: 22px; font-weight: 700; cursor: pointer">Y</button>
      <button style="position: absolute; top: 79px; left: 0; width: 72px; height: 72px; border-radius: 50%; border: 1px solid #27334D; background: #141D2E; color: #8AB8FF; font-size: 22px; font-weight: 700; cursor: pointer">X</button>
      <button style="position: absolute; top: 79px; right: 0; width: 72px; height: 72px; border-radius: 50%; border: none; background: #F5A524; color: #1A1206; font-size: 22px; font-weight: 700; cursor: pointer">B</button>
      <button style="position: absolute; bottom: 0; left: 79px; width: 72px; height: 72px; border-radius: 50%; border: none; background: {{accent}}; color: #FFFFFF; font-size: 22px; font-weight: 700; cursor: pointer">A</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6D5AE6","#0E8A7E"]},"$preview":{"width":844,"height":390}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F6FEB' };
}
}
</script>
</body>
</html>
