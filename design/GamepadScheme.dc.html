<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>游戏手柄 选择键位方案</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B8D3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #E8EDF7; font-family: 'Noto Sans SC', system-ui, sans-serif; padding: 16px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
    <a href="Main.dc.html" aria-label="返回首页" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 700">选择键位方案</div>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="font-size: 13px; color: #9AA6BD; line-height: 1.6">手柄界面不变，只改变每个按钮发给电脑的键。上次使用的方案会自动选中。</div>

  <div style="font-size: 13px; font-weight: 500; color: #9AA6BD; padding: 4px 4px 0">内置</div>
  <div style="border-radius: 16px; border: 1.5px solid {{accent}}; background: #16223A; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 22px; height: 22px; border-radius: 50%; border: 6px solid {{accent}}; box-sizing: border-box; flex-shrink: 0" aria-hidden="true"></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 700">默认键位</span>
      <span style="font-size: 12px; color: #9AA6BD">方向 WSAD · X U · Y I · A J · B K · Select 1 · Start 5</span>
    </span>
    <span style="font-size: 12px; color: #8AB8FF">当前</span>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 6px 4px 0">
    <span style="font-size: 13px; font-weight: 500; color: #9AA6BD">我的方案</span>
    <span style="font-size: 12px; color: #9AA6BD">2 套</span>
  </div>

  <div style="border-radius: 16px; border: 1px solid #27334D; background: #141D2E; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #4A5878; box-sizing: border-box; flex-shrink: 0" aria-hidden="true"></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 700">赛车游戏</span>
      <span style="font-size: 12px; color: #9AA6BD">方向 ↑↓←→ · A 空格 · B Shift · Start Esc</span>
    </span>
    <a href="KeyEdit.dc.html" aria-label="编辑方案 赛车游戏" style="width: 44px; height: 44px; border-radius: 12px; color: #9AA6BD; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </a>
  </div>

  <div style="border-radius: 16px; border: 1px solid #27334D; background: #141D2E; padding: 10px 8px 10px 16px; display: flex; align-items: center; gap: 12px">
    <span style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid #4A5878; box-sizing: border-box; flex-shrink: 0" aria-hidden="true"></span>
    <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 15px; font-weight: 700">格斗游戏</span>
      <span style="font-size: 12px; color: #9AA6BD">方向 WSAD · X U · Y I · A J · B K+L 组合</span>
    </span>
    <a href="KeyEdit.dc.html" aria-label="编辑方案 格斗游戏" style="width: 44px; height: 44px; border-radius: 12px; color: #9AA6BD; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
    </a>
  </div>

  <a href="KeyEdit.dc.html" style="height: 56px; border-radius: 16px; border: 1px dashed #3A4866; color: #8AB8FF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; text-decoration: none">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    新建方案
  </a>

  <div style="font-size: 12px; color: #9AA6BD; padding: 0 4px">长按方案可删除</div>

  <a href="Gamepad.dc.html" style="margin-top: auto; height: 56px; border-radius: 18px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 17px; font-weight: 700; text-decoration: none">
    用「默认键位」打开手柄
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
  </a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6D5AE6","#0E8A7E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F6FEB' };
}
}
</script>
</body>
</html>
