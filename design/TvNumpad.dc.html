<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>电视遥控器 数字键</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#8AB8FF}a:hover{color:#B8D3FF}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0B1220; color: #E8EDF7; font-family: 'Noto Sans SC', system-ui, sans-serif; padding: 16px 24px 28px; display: flex; flex-direction: column; gap: 24px">

  <div style="display: flex; align-items: center; justify-content: space-between; height: 48px">
    <a href="TvRemote.dc.html" aria-label="返回遥控器" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; display: flex; align-items: center; justify-content: center">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 17px; font-weight: 700">数字键</div>
    <div style="width: 44px; height: 44px"></div>
  </div>

  <div style="background: #141D2E; border: 1px solid #27334D; border-radius: 20px; padding: 20px 22px; display: flex; flex-direction: column; gap: 6px">
    <div style="font-size: 13px; color: #9AA6BD">最近发送</div>
    <div style="display: flex; align-items: center; gap: 4px; height: 64px">
      <span style="font-size: 44px; font-weight: 700; letter-spacing: 4px">2026.10</span>
      <span style="width: 3px; height: 40px; border-radius: 2px; background: {{accent}}"></span>
    </div>
    <div style="font-size: 12px; color: #9AA6BD">每按一次立即发送到电脑，这里只做回显</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">1</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">2</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">3</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">4</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">5</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">6</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">7</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">8</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">9</button>
    <button aria-label="小数点" style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">.</button>
    <button style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #141D2E; color: #E8EDF7; font-size: 26px; font-weight: 500; cursor: pointer">0</button>
    <button aria-label="退格 Backspace" style="height: 72px; border-radius: 18px; border: 1px solid #27334D; background: #0B1220; color: #9AA6BD; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 5H9l-6 7 6 7h12z"></path><path d="M17 9l-5 6M12 9l5 6"></path></svg>
    </button>
  </div>

  <button style="margin-top: auto; height: 56px; border-radius: 18px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; cursor: pointer">回车 Enter</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F6FEB","options":["#2F6FEB","#6D5AE6","#0E8A7E"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return { accent: this.props.accent ?? '#2F6FEB' };
}
}
</script>
</body>
</html>
